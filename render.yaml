services:
  - type: web
    name: festival-3pc-realtime
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --production=false && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SITE_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
